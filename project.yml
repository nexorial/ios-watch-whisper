name: Micodex
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  bundleIdPrefix: com.nexorial
  deploymentTarget:
    macOS: '13.0'
    watchOS: '9.0'
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: 14
    DEVELOPMENT_TEAM: JNN5TPN23D
    CODE_SIGN_STYLE: Automatic
packages:
  MicodexCore:
    path: .
targets:
  MicodexMac:
    type: application
    productName: Micodex
    entitlements:
      path: Config/Mac.entitlements
      properties:
        com.apple.security.personal-information.location: true
    platform: macOS
    sources: [Mac, Shared, AppResources]
    dependencies:
      - package: MicodexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper.mac
        PRODUCT_NAME: Micodex
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Mac-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Show the current Wi-Fi name to help you check your Mac and Watch connection. Micodex does not collect location coordinates."
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: Micodex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "Connect your approved Apple Watch and Mac for scrolling, dictation, and Enter commands."
        NSLocalNetworkUsageDescription: "Create an encrypted local-network connection with your approved Apple Watch."
        NSBluetoothPeripheralUsageDescription: "Make this Mac discoverable to your Apple Watch for a private remote connection."
        NSLocationUsageDescription: "Show the current Wi-Fi name to help you check your Mac and Watch connection. Micodex does not collect location coordinates."
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Nexorial
  Micodex:
    type: application.watchapp2-container
    sources: [AppResources]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - target: MicodexWatch
    info:
      path: Config/Container-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Show the current Wi-Fi name to help you check your Mac and Watch connection. Micodex does not collect location coordinates."
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: Micodex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: "Use the built-in Apple Watch microphone to send your speech to Codex dictation on your paired Mac."
        ITSAppUsesNonExemptEncryption: false
  MicodexWatch:
    type: application
    productName: Micodex Watch
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    platform: watchOS
    sources: [Watch, Shared, AppResources]
    dependencies:
      - package: MicodexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper.watchkitapp
        PRODUCT_NAME: Micodex Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '4'
        MICODEX_HOST: ""
        MICODEX_PIN: ""
        SDKROOT: watchos
        SKIP_INSTALL: YES
    info:
      path: Config/Watch-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Show the current Wi-Fi name to help you check your Mac and Watch connection. Micodex does not collect location coordinates."
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleDisplayName: Micodex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MicodexWiFiHost: $(MICODEX_HOST)
        MicodexWiFiPin: $(MICODEX_PIN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        WKApplication: true
        WKWatchOnly: true
        WKSupportsAlwaysOnDisplay: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: "Connect your approved Apple Watch and Mac for scrolling, dictation, and Enter commands."
        NSMicrophoneUsageDescription: "Use the built-in Apple Watch microphone to send your speech to Codex dictation on your paired Mac."
schemes:
  MicodexMac:
    build:
      targets:
        MicodexMac: all
  MicodexWatch:
    build:
      targets:
        MicodexWatch: all
  Micodex:
    build:
      targets:
        Micodex: all
