name: WatchWhisper
options:
  bundleIdPrefix: com.nexorial
  deploymentTarget:
    macOS: '13.0'
    watchOS: '9.0'
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: 4
    DEVELOPMENT_TEAM: JNN5TPN23D
    CODE_SIGN_STYLE: Automatic
packages:
  WhisperCore:
    path: .
targets:
  WatchWhisperMac:
    type: application
    productName: Watch Whisper
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: WhisperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper.mac
        PRODUCT_NAME: Watch Whisper
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Config/Mac-Info.plist
      properties:
        CFBundleDisplayName: Watch Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: 与你批准的 Apple Watch 连接，接收滚动、听写和 Enter 指令。
        NSLocalNetworkUsageDescription: 与你批准的 Apple Watch 建立加密的局域网遥控连接。
        NSBluetoothPeripheralUsageDescription: 向 Apple Watch 广播本机，建立私人遥控连接。
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Nexorial
  WatchWhisper:
    type: application.watchapp2-container
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - target: WatchWhisperWatch
    info:
      path: Config/Container-Info.plist
      properties:
        CFBundleDisplayName: Watch Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  WatchWhisperWatch:
    type: application
    productName: Watch Whisper Watch
    platform: watchOS
    sources: [Watch]
    dependencies:
      - package: WhisperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexorial.watchwhisper.watchkitapp
        PRODUCT_NAME: Watch Whisper Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        WATCH_WHISPER_HOST: ""
        WATCH_WHISPER_PIN: ""
        SDKROOT: watchos
        SKIP_INSTALL: YES
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Watch Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WatchWhisperWiFiHost: $(WATCH_WHISPER_HOST)
        WatchWhisperWiFiPin: $(WATCH_WHISPER_PIN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: 与你的 Mac 直接连接，用表冠滚动、传输你的语音和发送 Enter。
        NSMicrophoneUsageDescription: 使用 Apple Watch 内置麦克风采集你主动说的话，通过配对的 Mac 交给 Codex 听写。
schemes:
  WatchWhisperMac:
    build:
      targets:
        WatchWhisperMac: all
  WatchWhisperWatch:
    build:
      targets:
        WatchWhisperWatch: all
  WatchWhisper:
    build:
      targets:
        WatchWhisper: all
